{{ define "main" }}
<article class="list-page">
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  {{ .Content }}
  <ul class="page-list">
  {{ range .Pages }}
    <li><a href="{{ .Permalink }}"><strong>{{ .Title }}</strong></a>{{ with .Params.description }} — {{ . }}{{ end }}</li>
  {{ end }}
  </ul>
</article>
{{ end }}
