<!-- Luc Létoffé — favicon set Datum -->
<!-- Place /favicon.svg, /favicon.ico, /apple-touch-icon.png, /favicon-{16,32,48,96,192,512}x{n}.png, /safari-pinned-tab.svg, /site.webmanifest à la racine du site -->

<!-- Modern browsers : SVG vectoriel, suit dark/light system -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Fallback ICO multi-rés (legacy IE / certains contextes) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- Tailles PNG explicites (Android, anciens navigateurs) -->
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">

<!-- Apple touch icon (iOS home screen) — fond #0a1f23 -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Safari pinned tab (silhouette monochrome) -->
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#4a7f8a">

<!-- PWA manifest -->
<link rel="manifest" href="/site.webmanifest">

<!-- Couleur de la barre de navigation mobile -->
<meta name="theme-color" content="#0a1f23">
<meta name="msapplication-TileColor" content="#0a1f23">
