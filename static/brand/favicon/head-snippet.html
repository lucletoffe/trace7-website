<!-- ============================================================
     undust — favicon set
     À copier-coller dans <head> de tous les sites undust.
     Ordre important : SVG en premier (browsers modernes), puis fallbacks.
============================================================ -->

<!-- Favicon SVG (browsers modernes — adaptatif clair/sombre) -->
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- Fallback PNG (browsers qui ignorent le SVG) -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<!-- Legacy ICO (IE / Edge / vieux Safari) -->
<link rel="shortcut icon" href="/favicon.ico">

<!-- Apple touch icon (iOS home screen) -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Safari pinned tab (Safari macOS uniquement) -->
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#ff6b35">

<!-- PWA manifest -->
<link rel="manifest" href="/manifest.webmanifest">

<!-- Theme color (browser chrome mobile) -->
<meta name="theme-color" content="#ff6b35">
<meta name="msapplication-TileColor" content="#ff6b35">
