<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>undust — banner V3 final (4 offer badges)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,300&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  body { width: 1584px; height: 396px; overflow: hidden; }
  .frame {
    width: 1584px; height: 396px; background: #1a1a1a;
    font-family: 'Titillium Web', sans-serif; color: #e5e7eb;
    position: relative; overflow: hidden;
  }
  .badge {
    position: absolute; top: 38px; left: 430px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 21px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: #ff6b35; display: inline-flex; align-items: center; gap: 12px;
    padding: 8px 16px; border: 1.5px solid #ff6b35; border-radius: 4px;
  }
  .badge-dot { width: 8px; height: 8px; background: #ff6b35; border-radius: 50%; }
  .wordmark {
    position: absolute; top: 38px; right: 80px;
    font-family: 'Titillium Web', sans-serif;
    font-weight: 700; font-size: 46px; letter-spacing: -0.8px;
    color: #e5e7eb; z-index: 3; line-height: 1; text-align: right;
  }
  .wordmark-dot { color: #ff6b35; }
  .verbs {
    position: absolute; top: 118px; right: 80px; z-index: 3;
    display: flex; flex-direction: column; gap: 16px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    text-align: right;
  }
  .verb { display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .verb-text { color: #e5e7eb; }
  .verb-dot {
    width: 8px; height: 8px; background: #ff6b35; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .slogan {
    position: absolute; top: 100px; left: 430px;
    font-size: 84px; font-weight: 700; line-height: 0.98; letter-spacing: -2.4px; z-index: 2;
  }
  .slogan-line-1 { color: #e5e7eb; }
  .slogan-line-2 { color: #ff6b35; }
  /* 4 badges d'offre en bas */
  .offers {
    position: absolute; top: 312px; left: 430px; z-index: 2;
    display: inline-flex; align-items: center; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase; line-height: 1;
  }
  .offer { padding: 10px 18px; border: 1.5px solid; border-radius: 4px; }
  .offer.audit       { color: #4A7F8A; border-color: #4A7F8A; background: rgba(74,127,138,0.12); }
  .offer.prestations { color: #8A8478; border-color: #8A8478; background: rgba(138,132,120,0.12); }
  .offer.saas        { color: #B84848; border-color: #B84848; background: rgba(184,72,72,0.12); }
  .offer.media       { color: #4ADE80; border-color: #4ADE80; background: rgba(74,222,128,0.10); }
  .grid-corner { position: absolute; top: 0; right: 0; opacity: 0.7; pointer-events: none; }
</style>
</head>
<body>
<div class="frame">
  <svg class="grid-corner" width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="tg" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4a7f8a" stroke-width="1.2"/>
      </pattern>
      <linearGradient id="fg" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1a1a1a" stop-opacity="1"/>
        <stop offset="60%" stop-color="#1a1a1a" stop-opacity="0"/>
      </linearGradient>
      <mask id="gm">
        <rect width="500" height="280" fill="white"/>
        <rect width="500" height="280" fill="url(#fg)"/>
      </mask>
    </defs>
    <rect width="500" height="280" fill="url(#tg)" mask="url(#gm)"/>
  </svg>

  <div class="badge"><span class="badge-dot"></span>ia · industrie · hardware · france</div>

  <div class="wordmark">undust<span class="wordmark-dot">.</span></div>

  <div class="verbs">
    <div class="verb"><span class="verb-text">Capter</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Structurer</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Indexer</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Transmettre</span><span class="verb-dot"></span></div>
  </div>

  <div class="slogan">
    <div class="slogan-line-1">VOTRE EXPERT PART.</div>
    <div class="slogan-line-2">SON SAVOIR RESTE.</div>
  </div>

  <div class="offers">
    <span class="offer audit">AUDIT</span>
    <span class="offer prestations">PRESTATIONS</span>
    <span class="offer saas">SAAS</span>
    <span class="offer media">MEDIA</span>
  </div>
</div>
</body>
</html>
