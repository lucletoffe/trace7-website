<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>undust — banner C export (mobile-safe v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;1,300&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  body { width: 1584px; height: 396px; overflow: hidden; }
  .frame {
    width: 1584px; height: 396px; background: #1a1a1a;
    font-family: 'Titillium Web', sans-serif; color: #e5e7eb;
    position: relative; overflow: hidden;
  }
  /* Safe zone LinkedIn : x 320-1300, y 70-290 (avatar 152px en bas-gauche, bouton "Suivre" en bas-droit). */
  .badge {
    position: absolute; top: 36px; left: 320px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: #ff6b35; display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 14px; border: 1px solid #ff6b35; border-radius: 4px;
  }
  .badge-dot { width: 7px; height: 7px; background: #ff6b35; border-radius: 50%; }
  .wordmark {
    position: absolute; top: 36px; right: 80px;
    font-family: 'Titillium Web', sans-serif;
    font-weight: 700; font-size: 26px; letter-spacing: -0.5px;
    color: #e5e7eb; z-index: 3; line-height: 1; text-align: right;
  }
  .wordmark-dot { color: #ff6b35; }
  .verbs {
    position: absolute; top: 90px; right: 80px; z-index: 3;
    display: flex; flex-direction: column; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    letter-spacing: 0.18em; text-transform: uppercase;
    text-align: right;
  }
  .verb { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .verb-text { color: #e5e7eb; }
  .verb-dot {
    width: 7px; height: 7px; background: #ff6b35; border-radius: 50%;
    display: inline-block; flex-shrink: 0;
  }
  .slogan {
    position: absolute; top: 100px; left: 320px; right: 360px;
    font-size: 72px; font-weight: 700; line-height: 1.0; letter-spacing: -2.0px; z-index: 2;
  }
  .slogan-line-1 { color: #e5e7eb; }
  .slogan-line-2 { color: #ff6b35; }
  .subtitle {
    position: absolute; top: 264px; left: 320px; right: 360px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 26px;
    color: #cbd1d9; letter-spacing: 0.02em; line-height: 1.3; font-weight: 500;
    white-space: nowrap;
  }
  .subtitle .france { color: #4ade80; font-weight: 500; }
  .subtitle .sep { color: #ff6b35; padding: 0 6px; }
  .grid-corner { position: absolute; top: 0; right: 0; opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<div class="frame">
  <svg class="grid-corner" width="500" height="280" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="tg" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#4a7f8a" stroke-width="1.2"/>
      </pattern>
      <linearGradient id="fg" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#1a1a1a" stop-opacity="1"/>
        <stop offset="60%" stop-color="#1a1a1a" stop-opacity="0"/>
      </linearGradient>
      <mask id="gm">
        <rect width="500" height="280" fill="white"/>
        <rect width="500" height="280" fill="url(#fg)"/>
      </mask>
    </defs>
    <rect width="500" height="280" fill="url(#tg)" mask="url(#gm)"/>
  </svg>

  <div class="badge"><span class="badge-dot"></span>ia · industrie · hardware · france</div>

  <div class="wordmark">undust<span class="wordmark-dot">.</span></div>

  <div class="verbs">
    <div class="verb"><span class="verb-text">Capter</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Structurer</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Indexer</span><span class="verb-dot"></span></div>
    <div class="verb"><span class="verb-text">Transmettre</span><span class="verb-dot"></span></div>
  </div>

  <div class="slogan">
    <div class="slogan-line-1">VOTRE EXPERT PART.</div>
    <div class="slogan-line-2">SON SAVOIR RESTE.</div>
  </div>

  <div class="subtitle">
    On audite. On outille. On transmet.
  </div>
</div>
</body>
</html>
