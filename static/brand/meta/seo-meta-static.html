<!--
  SEO meta — snippet HTML pur pour sites static (AFHW, lucletoffe.com)
  À copier dans <head> de chaque page.
  Remplacer les placeholders {{...}} par les valeurs de la page.
-->

<title>{{TITLE}} — {{SITE_NAME}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large">
<meta http-equiv="content-language" content="fr-FR">

<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}"> <!-- website OR article -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:site_name" content="{{SITE_NAME}}">
<meta property="og:locale" content="fr_FR">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@lucletoffe">
<meta name="twitter:creator" content="@lucletoffe">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE_URL}}">

<!-- JSON-LD (1 par page minimum + Organization/Person au site-level) -->
<script type="application/ld+json">{{JSONLD}}</script>

<!--
  Liste des placeholders à remplacer :
  - {{TITLE}}             — Titre de la page (50-60 chars)
  - {{SITE_NAME}}         — Nom du site (ex : "Antifragile Hardware", "Luc Létoffé")
  - {{DESCRIPTION}}       — Description (150-160 chars)
  - {{CANONICAL_URL}}     — URL canonique absolue
  - {{OG_TYPE}}           — "website" pour pages standard, "article" pour blog/article
  - {{OG_IMAGE_URL}}      — URL absolue de l'image OG 1200×630
  - {{OG_IMAGE_ALT}}      — Texte alternatif de l'image
  - {{JSONLD}}            — JSON-LD inline (voir jsonld-XXX.json par marque)
-->
