<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>OG — signal.antifrag.fr</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#1a1a1a; --ink:#e5e7eb; --muted:#9ca3af; --orange:#ff6b35; --teal:#4a7f8a; --critical:#b84848; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; background:#000; overflow:hidden; }
  .og { width:1200px; height:630px; background:var(--bg); position:relative; overflow:hidden; font-family:"Titillium Web",sans-serif; color:var(--ink); }
  .corner-grid { position:absolute; top:0; right:0; width:520px; height:520px;
    background-image: linear-gradient(to right, rgba(184,72,72,0.50) 2px, transparent 2px), linear-gradient(to bottom, rgba(184,72,72,0.50) 2px, transparent 2px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%);
            mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%); }
  .monogram { position:absolute; top:80px; left:80px; width:104px; height:104px; }
  .monogram svg { width:100%; height:100%; }
  .badge { position:absolute; top:108px; left:220px; padding:12px 22px; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:16px; letter-spacing:0.2em; text-transform:uppercase; color:#fff; background:var(--critical); border-radius:6px; }
  .name { position:absolute; top:240px; left:80px; right:80px; font-weight:700; font-size:124px; line-height:0.94; letter-spacing:-3px; text-transform:uppercase; color:var(--ink); }
  .name .accent { color:var(--critical); }
  .name .dot { color:var(--orange); }
  .tagline { position:absolute; left:80px; right:80px; bottom:110px; font-weight:400; font-size:28px; line-height:1.3; letter-spacing:-0.3px; color:var(--muted); max-width:1040px; }
  .tagline strong { color:var(--ink); font-weight:600; }
  .url { position:absolute; bottom:48px; left:80px; font-family:"JetBrains Mono",monospace; font-weight:500; font-size:20px; color:var(--muted); letter-spacing:0.04em; }
  .wordmark-foot { position:absolute; bottom:48px; right:80px; font-weight:700; font-size:22px; color:var(--muted); letter-spacing:-0.4px; }
  .wordmark-foot .dot { color:var(--orange); }
</style>
</head>
<body>
<div class="og">
  <div class="corner-grid"></div>
  <div class="monogram">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <rect x="8" y="20" width="48" height="24" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linejoin="round"/>
      <line x1="32" y1="20" x2="32" y2="44" stroke="#e5e7eb" stroke-width="3"/>
      <path d="M 26 27 C 26 23, 14 23, 14 28 C 14 33, 26 32, 26 37 C 26 42, 14 42, 14 38" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round"/>
      <circle cx="44" cy="32" r="5.5" fill="none" stroke="#b84848" stroke-width="2"/>
      <circle cx="44" cy="32" r="1.8" fill="#b84848"/>
    </svg>
  </div>
  <div class="badge">NEWSLETTER &middot; ANT-7</div>
  <div class="name">SIGNAL<br/><span class="accent">ANTIFRAGILE<span class="dot">.</span></span></div>
  <div class="tagline"><strong>Newsletter hebdomadaire</strong> &mdash; industrie critique, veille technique, doctrine &laquo; filiation pas disruption &raquo;.</div>
  <div class="url">signal.antifrag.fr</div>
  <div class="wordmark-foot">undust<span class="dot">.</span></div>
</div>
</body>
</html>
