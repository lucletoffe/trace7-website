<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>OG — undust.co</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#1a1a1a; --ink:#e5e7eb; --muted:#9ca3af; --orange:#ff6b35; --teal:#4a7f8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; background:#000; overflow:hidden; }
  .og { width:1200px; height:630px; background:var(--bg); position:relative; overflow:hidden; font-family:"Titillium Web",sans-serif; color:var(--ink); }
  .corner-grid { position:absolute; top:0; right:0; width:520px; height:520px;
    background-image: linear-gradient(to right, rgba(74,127,138,0.55) 2px, transparent 2px), linear-gradient(to bottom, rgba(74,127,138,0.55) 2px, transparent 2px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%);
            mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%); }
  .monogram { position:absolute; top:80px; left:80px; width:96px; height:96px; }
  .monogram svg { width:100%; height:100%; }
  .wordmark-big { position:absolute; top:230px; left:80px; font-family:"Titillium Web",sans-serif; font-weight:700; font-size:208px; line-height:1; letter-spacing:-6px; color:var(--ink); }
  .wordmark-big .dot { color:var(--orange); }
  .tagline { position:absolute; left:80px; right:80px; bottom:120px; font-weight:400; font-size:32px; line-height:1.3; letter-spacing:-0.3px; color:var(--ink); max-width:1040px; }
  .tagline .accent { color:var(--orange); font-weight:600; }
  .url { position:absolute; bottom:48px; left:80px; font-family:"JetBrains Mono",monospace; font-weight:500; font-size:20px; color:var(--muted); letter-spacing:0.04em; }
  .category { position:absolute; bottom:48px; right:80px; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:14px; color:var(--orange); letter-spacing:0.24em; text-transform:uppercase; }
</style>
</head>
<body>
<div class="og">
  <div class="corner-grid"></div>
  <div class="monogram">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <rect x="8" y="20" width="48" height="24" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linejoin="round"/>
      <line x1="32" y1="20" x2="32" y2="44" stroke="#e5e7eb" stroke-width="3"/>
      <path d="M 16 26 V 36 Q 16 40 20 40 Q 24 40 24 36 V 26" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="44" cy="32" r="4" fill="#ff6b35"/>
    </svg>
  </div>
  <div class="wordmark-big">undust<span class="dot">.</span></div>
  <div class="tagline"><span class="accent">Continuit&eacute; cognitive industrielle</span> pour PME hardware critique.</div>
  <div class="url">undust.co</div>
  <div class="category">CONTINUIT&Eacute; COGNITIVE</div>
</div>
</body>
</html>
