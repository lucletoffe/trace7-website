<!DOCTYPE html>
<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root { --bg:#1a1a1a; --ink:#e5e7eb; --muted:#9ca3af; --orange:#ff6b35; --teal:#4a7f8a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; background:#000; overflow:hidden; }
  .og { width:1200px; height:630px; background:var(--bg); position:relative; overflow:hidden; font-family:"Titillium Web",sans-serif; color:var(--ink); }
  .corner-grid { position:absolute; top:0; right:0; width:520px; height:520px;
    background-image: linear-gradient(to right, rgba(74,127,138,0.55) 2px, transparent 2px), linear-gradient(to bottom, rgba(74,127,138,0.55) 2px, transparent 2px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%);
            mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%); }
  .monogram { position:absolute; top:80px; left:80px; width:104px; height:104px; }
  .monogram svg { width:100%; height:100%; }
  .badge { position:absolute; top:108px; left:220px; padding:12px 22px; font-family:"JetBrains Mono",monospace; font-weight:700; font-size:16px; letter-spacing:0.2em; text-transform:uppercase; color:#fff; background:var(--teal); border-radius:6px; }
  .name { position:absolute; top:240px; left:80px; right:80px; font-weight:700; font-size:108px; line-height:0.94; letter-spacing:-3px; text-transform:uppercase; color:var(--ink); }
  .name .accent { color:var(--orange); }
  .tagline { position:absolute; left:80px; right:80px; bottom:110px; font-weight:400; font-size:28px; line-height:1.3; letter-spacing:-0.3px; color:var(--muted); max-width:1040px; }
  .tagline strong { color:var(--ink); font-weight:600; }
  .url { position:absolute; bottom:48px; left:80px; font-family:"JetBrains Mono",monospace; font-weight:500; font-size:20px; color:var(--muted); letter-spacing:0.04em; }
  .wordmark-foot { position:absolute; bottom:48px; right:80px; font-weight:700; font-size:22px; color:var(--muted); letter-spacing:-0.4px; }
  .wordmark-foot .dot { color:var(--orange); }
</style>
</head>
<body>
<div class="og">
  <div class="corner-grid"></div>
  <div class="monogram">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <rect x="8" y="20" width="48" height="24" fill="none" stroke="#e5e7eb" stroke-width="3" stroke-linejoin="round"/>

      <circle cx="44" cy="32" r="5" fill="none" stroke="#4a7f8a" stroke-width="2"/>
      <line x1="44" y1="25" x2="44" y2="39" stroke="#4a7f8a" stroke-width="2" stroke-linecap="round"/>
      <line x1="37" y1="32" x2="51" y2="32" stroke="#4a7f8a" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="badge">FONDATEUR &middot; UNDUST</div>
  <div class="name">LUC<br/>L&Eacute;<span class="accent">TOFF&Eacute;.</span></div>
  <div class="tagline"><strong>15 ans terrain industriel.</strong> Speaker continuit&eacute; cognitive industrielle. Valeo &middot; Hitachi &middot; Hall32.</div>
  <div class="url">lucletoffe.com</div>

</div>
</body>
