<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>OG image — {{BRAND}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:#1a1a1a; --ink:#e5e7eb; --muted:#9ca3af;
    --orange:#ff6b35; --teal:#4a7f8a; --critical:#b84848;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1200px; height:630px; background:#000; overflow:hidden; }
  .og {
    width:1200px; height:630px;
    background:var(--bg);
    position:relative;
    overflow:hidden;
    font-family:"Titillium Web",sans-serif;
    color:var(--ink);
  }
  .corner-grid {
    position:absolute; top:0; right:0;
    width:520px; height:520px;
    background-image:
      linear-gradient(to right, rgba(74,127,138,0.55) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(74,127,138,0.55) 2px, transparent 2px);
    background-size:64px 64px;
    -webkit-mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%);
            mask-image: radial-gradient(circle at top right, #000 0%, #000 28%, transparent 72%);
    pointer-events:none;
  }
  .monogram {
    position:absolute;
    top:80px; left:80px;
    width:96px; height:96px;
  }
  .monogram svg { width:100%; height:100%; display:block; }
  .badge {
    position:absolute;
    top:100px; left:200px;
    padding:14px 22px;
    font-family:"JetBrains Mono",monospace;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#fff;
    background:var(--badge-bg, var(--teal));
    border-radius:6px;
  }
  .name {
    position:absolute;
    top:240px; left:80px; right:80px;
    font-weight:700;
    font-size:96px;
    line-height:0.96;
    letter-spacing:-2.5px;
    text-transform:uppercase;
    color:var(--ink);
  }
  .name .accent { color:var(--orange); }
  .tagline {
    position:absolute;
    left:80px; right:80px;
    bottom:90px;
    font-weight:400;
    font-size:28px;
    line-height:1.3;
    letter-spacing:-0.3px;
    color:var(--muted);
    max-width:1000px;
  }
  .tagline strong { color:var(--ink); font-weight:600; }
  .wordmark-foot {
    position:absolute;
    bottom:48px; right:80px;
    font-weight:700;
    font-size:24px;
    color:var(--muted);
    letter-spacing:-0.4px;
  }
  .wordmark-foot .dot { color:var(--orange); }
  .url {
    position:absolute;
    bottom:48px; left:80px;
    font-family:"JetBrains Mono",monospace;
    font-weight:500;
    font-size:18px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>
<!-- CARD_CONTENT -->
</body>
</html>
