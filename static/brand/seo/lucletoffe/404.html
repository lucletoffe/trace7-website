<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Cette page s'est dépoussiérée</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #fafaf7; --text: #1a1a1a; --muted: #6b6b6b; --accent: #4A7F8A; --border: #d4d4d0; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: 'Titillium Web', system-ui, sans-serif; padding: 2rem; }
    .wrap { max-width: 560px; text-align: left; }
    .glyph { font-family: 'JetBrains Mono', monospace; font-size: 1.25rem; color: var(--accent); margin-bottom: 2rem; letter-spacing: 0.1em; }
    .code { font-family: 'JetBrains Mono', monospace; font-size: 0.875rem; color: var(--muted); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 0.75rem; }
    h1 { font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.15; margin: 0 0 1rem; letter-spacing: -0.015em; }
    p { color: var(--muted); font-size: 1.0625rem; line-height: 1.55; margin: 0 0 2rem; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
    a { color: var(--text); text-decoration: none; padding: 0.5rem 0; border-bottom: 1px solid var(--border); transition: color 0.15s, border-color 0.15s; display: inline-block; }
    a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="glyph">[LL]+⌖</div>
    <div class="code">404 · Not Found</div>
    <h1>Cette page s'est dépoussiérée.</h1>
    <p>Elle a été déplacée, archivée ou n'a jamais existé.</p>
    <ul>
      <li><a href="/">→ Accueil</a></li>
      <li><a href="/parcours.html">→ Parcours</a></li>
      <li><a href="/cv.html">→ CV</a></li>
    </ul>
  </main>
</body>
</html>
